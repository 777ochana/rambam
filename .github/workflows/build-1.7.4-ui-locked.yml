name: Build HaYad 1.7.4 UI Locked
on:
  push:
    branches: [v1.7.4-ui-locked]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hayad-1.7.4-ui-locked
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare backend-only payload and validated local corpus
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force patch-1.7.4/payload/app,patch-1.7.4/payload/local-library,prior | Out-Null
          Copy-Item patch-1.7.4/main.js patch-1.7.4/payload/app/main.js
          Copy-Item patch-1.7.4/package.json patch-1.7.4/payload/app/package.json
          gh release download hayad-v1.7.1-local-chat -p 'HaYad-HaHazaka-1.7.1-x64.zip' -p 'corpus-manifest-1.7.1.json' -D prior
          7z x prior/HaYad-HaHazaka-1.7.1-x64.zip -oprior/unpacked -y | Out-Null
          $db=Get-ChildItem prior/unpacked -Recurse -Filter 'torah-library.sqlite' -File | Select-Object -First 1
          if(-not $db){throw 'Local Torah DB not found'}
          Copy-Item $db.FullName patch-1.7.4/payload/local-library/torah-library.sqlite
          Copy-Item prior/corpus-manifest-1.7.1.json patch-1.7.4/payload/local-library/corpus-manifest.json
          Write-Host "DB MB=$([math]::Round((Get-Item patch-1.7.4/payload/local-library/torah-library.sqlite).Length/1MB,1))"
      - name: Install build tools, validate and compress corpus
        shell: pwsh
        run: |
          choco install sqlite nsis -y --no-progress
          $sqlite=Get-ChildItem 'C:\ProgramData\chocolatey\lib\SQLite\tools' -Recurse -Filter sqlite3.exe -File | Select-Object -First 1
          if(-not $sqlite){throw 'sqlite3.exe not found'}
          Copy-Item $sqlite.FullName patch-1.7.4/payload/local-library/sqlite3.exe
          $check=& patch-1.7.4/payload/local-library/sqlite3.exe -readonly patch-1.7.4/payload/local-library/torah-library.sqlite 'PRAGMA quick_check;'
          if(($check|Out-String).Trim() -ne 'ok'){throw "SQLite quick_check failed: $check"}
          Push-Location patch-1.7.4/payload/local-library
          7z a -tzip -mx=6 library.zip torah-library.sqlite corpus-manifest.json
          if($LASTEXITCODE -ne 0){throw 'Corpus compression failed'}
          Remove-Item torah-library.sqlite,corpus-manifest.json -Force
          Pop-Location
      - name: Normalize PowerShell encoding
        shell: pwsh
        run: |
          $p='patch-1.7.4/apply-patch.ps1'; $text=Get-Content $p -Raw -Encoding UTF8
          [System.IO.File]::WriteAllText((Resolve-Path $p),$text,(New-Object System.Text.UTF8Encoding($true)))
      - name: Full install smoke test — UI hash must remain unchanged
        shell: powershell
        run: |
          $fake=Join-Path $env:LOCALAPPDATA 'Programs\hayad-hahazaka'
          Remove-Item $fake -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $fake 'resources') | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $fake 'resources\app.asar'),[Text.Encoding]::UTF8.GetBytes('ORIGINAL-1.6.3-UI-BUNDLE-DO-NOT-TOUCH'))
          $before=(Get-FileHash (Join-Path $fake 'resources\app.asar') -Algorithm SHA256).Hash
          & .\patch-1.7.4\apply-patch.ps1 -Payload (Resolve-Path '.\patch-1.7.4\payload').Path -Quiet
          if($LASTEXITCODE -ne 0){throw "Patch smoke failed: $LASTEXITCODE"}
          $after=(Get-FileHash (Join-Path $fake 'resources\app.asar') -Algorithm SHA256).Hash
          $backup=(Get-FileHash (Join-Path $fake 'resources\app-1.6.3-original.asar') -Algorithm SHA256).Hash
          if($before -ne $after -or $before -ne $backup){throw 'UI LOCK FAILED: original app.asar changed'}
          if(-not (Test-Path (Join-Path $fake 'resources\app\main.js'))){throw 'Backend bridge missing'}
          $db=Join-Path $fake 'resources\local-library\torah-library.sqlite'; if(-not (Test-Path $db)){throw 'Local DB missing'}
          $sqlite=Join-Path $fake 'resources\local-library\sqlite3.exe'; $integrity=& $sqlite -readonly $db 'PRAGMA quick_check;'
          if(($integrity|Out-String).Trim() -ne 'ok'){throw 'Installed SQLite integrity failed'}
          Write-Host "UI LOCK SMOKE OK; OriginalSHA=$before; DBBytes=$((Get-Item $db).Length)"
          Remove-Item $fake -Recurse -Force
      - name: Compile Unicode installer
        shell: pwsh
        run: |
          Push-Location patch-1.7.4
          $makensis='C:\Program Files (x86)\NSIS\makensis.exe'
          & $makensis /INPUTCHARSET UTF8 installer.nsi
          if($LASTEXITCODE -ne 0){throw 'makensis failed'}
          Pop-Location
          Get-Item patch-1.7.4/HaYad-HaHazaka-Local-Library-1.7.4.exe | Format-List Name,Length
      - name: Checksum and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='patch-1.7.4/HaYad-HaHazaka-Local-Library-1.7.4.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  HaYad-HaHazaka-Local-Library-1.7.4.exe" | Set-Content patch-1.7.4/SHA256-1.7.4.txt
          $tag='hayad-v1.7.4-ui-locked'
          $notes='1.7.4 is backend-only. It never edits the original 1.6.3 app.asar, renderer, CSS, home diagram, 14-book layout, workspace or controls. It bridges the existing knowledge:list/search IPC to the large LOCAL SQLite corpus. The installer verifies the original app.asar SHA is unchanged and automatically rolls back to 1.6.3 if anything fails.'
          if(gh release view $tag *> $null){gh release upload $tag $exe patch-1.7.4/SHA256-1.7.4.txt --clobber}else{gh release create $tag $exe patch-1.7.4/SHA256-1.7.4.txt --title 'הרמב״ם הבהיר 1.7.4 — UI LOCKED, מאגר LOCAL' --notes $notes --target $env:GITHUB_SHA}
