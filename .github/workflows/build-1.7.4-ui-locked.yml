name: Build HaYad 1.7.4 UI-Locked Local Corpus
on:
  push:
    branches: [v1.7.4-ui-locked]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hayad-1.7.4-ui-locked-final
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools and validated local corpus
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build174/payload/asar-tool,build174/payload/local-library,prior | Out-Null
          Copy-Item build174/patch-main-1.7.4.js build174/payload/patch-main-1.7.4.js
          Copy-Item build174/apply-1.7.4.ps1 build174/apply-1.7.4.ps1
          Copy-Item (Get-Command node).Source build174/payload/asar-tool/node.exe
          npm install --prefix build174/payload/asar-tool @electron/asar@3.4.1 --omit=dev
          if(-not (Test-Path 'build174/payload/asar-tool/node_modules/@electron/asar/bin/asar.js')){throw 'ASAR tool missing'}
          choco install sqlite nsis -y --no-progress
          $sqlite=Get-ChildItem 'C:\ProgramData\chocolatey\lib\SQLite\tools' -Recurse -Filter sqlite3.exe -File | Select-Object -First 1
          if(-not $sqlite){throw 'sqlite3.exe missing'}
          Copy-Item $sqlite.FullName build174/payload/local-library/sqlite3.exe
          gh release download hayad-v1.7.1-local-chat -p 'HaYad-HaHazaka-1.7.1-x64.zip' -D prior
          7z x prior/HaYad-HaHazaka-1.7.1-x64.zip -oprior/unpacked -y | Out-Null
          $db=Get-ChildItem prior/unpacked -Recurse -Filter torah-library.sqlite -File | Select-Object -First 1
          if(-not $db){throw 'Local corpus DB not found'}
          Copy-Item $db.FullName build174/payload/local-library/torah-library.sqlite
          $check=& build174/payload/local-library/sqlite3.exe -readonly build174/payload/local-library/torah-library.sqlite 'PRAGMA quick_check;'
          if(($check|Out-String).Trim() -ne 'ok'){throw 'Corpus quick_check failed'}
          Push-Location build174/payload/local-library
          7z a -tzip -mx=6 library.zip torah-library.sqlite
          if($LASTEXITCODE -ne 0){throw 'Corpus compression failed'}
          Remove-Item torah-library.sqlite -Force
          Pop-Location
      - name: Assert backend patch syntax and UI lock constants
        shell: pwsh
        run: |
          node --check build174/patch-main-1.7.4.js
          $script=Get-Content build174/apply-1.7.4.ps1 -Raw -Encoding UTF8
          foreach($hash in @('e2a301bad496d87490eaceb091204d2287fa60f00c5d22341403e6f8daa69e76','6df2817f475b85236d7c4764d1fa2339673b3d827cd6442fbce042b5dbcefc37','74e52686fc6f255043062277f385b45cd85e2fdd16abc42dc00afbe18913de24')){if(-not $script.Contains($hash)){throw "Missing UI lock hash $hash"}}
          if(-not $script.Contains("Remove-Item `$wrapper -Recurse -Force")){throw 'Old wrapper recovery missing'}
      - name: Compile UTF-8 installer
        shell: pwsh
        run: |
          Copy-Item build174/installer-1.7.4.nsi build174/installer.nsi
          Push-Location build174
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /INPUTCHARSET UTF8 installer.nsi
          if($LASTEXITCODE -ne 0){throw 'makensis failed'}
          Pop-Location
      - name: Checksum and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='build174/HaYad-HaHazaka-Update-1.7.4.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  HaYad-HaHazaka-Update-1.7.4.exe" | Set-Content build174/SHA256-1.7.4.txt
          $notes=@'
          1.7.4 is a backend-only local-library integration over the original 1.6.3 application. The renderer is SHA-256 locked: index.js, index.css and index.html must be byte-identical to 1.6.3 or installation aborts. It removes the obsolete resources/app wrapper from 1.7.2/1.7.3, patches only dist-electron/main.js inside app.asar, and adds the validated local SQLite/FTS5 corpus. No diagram, layout, colors, fonts, navigation or editor UI are changed.
          '@
          $tag='hayad-v1.7.4-ui-locked'
          if(gh release view $tag *> $null){gh release upload $tag $exe build174/SHA256-1.7.4.txt --clobber}else{gh release create $tag $exe build174/SHA256-1.7.4.txt --title 'הרמב״ם הבהיר 1.7.4 — ממשק 1.6.3 AS IS + מאגר LOCAL' --notes $notes --target $env:GITHUB_SHA}
