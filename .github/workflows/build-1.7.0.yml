name: Build HaYad 1.7.0 Local Library
on: [workflow_dispatch]
jobs:
 build:
  runs-on: windows-latest
  timeout-minutes: 120
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - uses: actions/setup-node@v4
     with: {node-version: '20'}
   - name: Build licensed local Torah corpus
     shell: pwsh
     run: |
       python scripts/build_local_library.py
       New-Item -ItemType Directory -Force resources/ocr | Out-Null
       Invoke-WebRequest -Uri https://github.com/tesseract-ocr/tessdata_fast/raw/main/heb.traineddata -OutFile resources/ocr/heb.traineddata
   - name: Install and build Windows EXE
     shell: pwsh
     run: |
       npm install
       npm run build:win
   - name: Checksums
     shell: pwsh
     run: |
       Get-FileHash release/HaYad-HaHazaka-Update-1.7.0.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  HaYad-HaHazaka-Update-1.7.0.exe" } | Set-Content release/SHA256-1.7.0.txt
       Copy-Item resources/corpus-manifest.json release/corpus-manifest.json
   - uses: actions/upload-artifact@v4
     with:
       name: HaYad-HaHazaka-1.7.0
       path: |
        release/HaYad-HaHazaka-Update-1.7.0.exe
        release/SHA256-1.7.0.txt
        release/corpus-manifest.json
       compression-level: 0
       retention-days: 30
