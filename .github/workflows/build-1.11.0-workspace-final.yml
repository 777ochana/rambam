name: Build HaYad 1.11.0 Full Workspace
on:
  push:
    branches: [v1.11.0-workspace-final]
permissions:
  contents: write
concurrency:
  group: hayad-1.11.0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build111/payload/asar-tool | Out-Null
          Copy-Item build111/apply-1.11.0.js build111/payload/apply-1.11.0.cjs
          Copy-Item build111/core-library-ui-1.11.0.js build111/payload/core-library-ui.js
          Copy-Item build111/workspace-visual-noop.js build111/payload/workspace-visual-1.9.0.js
          Copy-Item (Get-Command node).Source build111/payload/asar-tool/node.exe
          npm install --prefix build111/payload/asar-tool @electron/asar@3.4.1 --omit=dev
          choco install nsis -y --no-progress
      - name: Validate complete workspace
        shell: pwsh
        run: |
          node --check build111/payload/apply-1.11.0.cjs
          node --check build111/payload/core-library-ui.js
          node --check build111/payload/workspace-visual-1.9.0.js
          $ui=Get-Content build111/payload/core-library-ui.js -Raw -Encoding UTF8
          foreach($x in @('workspaceDetected','הרמב״ם הבהיר','ש״ס','שו״ע ונושאי כליו','טור ונושאי כליו','תנ״ך ומפרשיו','מפרשי הרמב״ם','שו״ת ראשונים','שאל את המאגר','שמור הלכה ב־Word','מחברת מחקר','העלה ספר למאגר המקומי','API אישי','הוסף / מחק „הרמב״ם הבהיר”')){if(-not $ui.Contains($x)){throw "Missing 1.11 requirement: $x"}}
          if($ui.Contains("const HOME=['ספר המדע'")){throw 'Obsolete home-page text detector still exists'}
          $payload=(Resolve-Path build111/payload).Path
          $node=(Resolve-Path build111/payload/asar-tool/node.exe).Path
          & $node build111/payload/apply-1.11.0.cjs $payload --selftest --quiet
          if($LASTEXITCODE -ne 0){throw "1.11 self-test failed: $LASTEXITCODE"}
      - name: Compile Unicode installer
        shell: pwsh
        run: |
          Copy-Item build111/installer-1.11.0.nsi build111/installer.nsi
          Push-Location build111
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /INPUTCHARSET UTF8 installer.nsi
          if($LASTEXITCODE -ne 0){throw 'makensis failed'}
          Pop-Location
      - name: Checksum and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='build111/HaYad-HaHazaka-Update-1.11.0.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  HaYad-HaHazaka-Update-1.11.0.exe" | Set-Content build111/SHA256-1.11.0.txt
          $tag='hayad-v1.11.0-workspace-final'
          $notes='1.11.0 replaces only the working screen, not the 14-book home page. It implements the approved mockup as a full-screen workspace with one unified editable halakha surface; a fixed local-source core with Shas, Shulchan Arukh and commentaries, Tur and commentaries, Tanakh and commentators, Rambam commentaries, and Rishonim responsa; grounded multi-turn chat; editable/highlightable/copyable answers; local source preview and insertion; single-halakhah Word export; footnotes to expansions; research notebook; collapsible navigation; manual local-source import; and encrypted per-user API settings. The old 14-book text detector is removed.'
          gh release view $tag --json tagName *> $null
          if($LASTEXITCODE -eq 0){gh release upload $tag $exe build111/SHA256-1.11.0.txt --clobber} else {gh release create $tag $exe build111/SHA256-1.11.0.txt --title 'הרמב״ם הבהיר 1.11.0 — סביבת עבודה מלאה' --notes $notes --target $env:GITHUB_SHA}
          if($LASTEXITCODE -ne 0){throw 'Release publish failed'}
