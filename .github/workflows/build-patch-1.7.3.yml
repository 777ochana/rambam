name: Build HaYad 1.7.3 Fixed Installer
on:
  push:
    branches: [v1.7.3-fix-installer]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hayad-1.7.3-patch
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local library payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force patch-1.7.2/payload/app,patch-1.7.2/payload/local-library,prior | Out-Null
          Copy-Item patch-1.7.2/main.js patch-1.7.2/payload/app/main.js
          Copy-Item patch-1.7.2/package.json patch-1.7.2/payload/app/package.json
          gh release download hayad-v1.7.1-local-chat -p 'HaYad-HaHazaka-1.7.1-x64.zip' -p 'corpus-manifest-1.7.1.json' -D prior
          7z x prior/HaYad-HaHazaka-1.7.1-x64.zip -oprior/unpacked -y | Out-Null
          $db=Get-ChildItem prior/unpacked -Recurse -Filter 'torah-library.sqlite' -File | Select-Object -First 1
          if(-not $db){ throw 'Local Torah DB not found' }
          Copy-Item $db.FullName patch-1.7.2/payload/local-library/torah-library.sqlite
          Copy-Item prior/corpus-manifest-1.7.1.json patch-1.7.2/payload/local-library/corpus-manifest.json
          Write-Host "DB MB=$([math]::Round((Get-Item patch-1.7.2/payload/local-library/torah-library.sqlite).Length/1MB,1))"
      - name: Install build tools and compress corpus
        shell: pwsh
        run: |
          choco install sqlite nsis -y --no-progress
          $sqlite=Get-ChildItem 'C:\ProgramData\chocolatey\lib\SQLite\tools' -Recurse -Filter sqlite3.exe -File | Select-Object -First 1
          if(-not $sqlite){ throw 'sqlite3.exe not found after Chocolatey install' }
          Copy-Item $sqlite.FullName patch-1.7.2/payload/local-library/sqlite3.exe
          & patch-1.7.2/payload/local-library/sqlite3.exe -version
          Push-Location patch-1.7.2/payload/local-library
          7z a -tzip -mx=6 library.zip torah-library.sqlite corpus-manifest.json
          if($LASTEXITCODE -ne 0){throw 'Corpus compression failed'}
          $zip=Get-Item library.zip
          Write-Host "Compressed corpus MB=$([math]::Round($zip.Length/1MB,1))"
          if($zip.Length -ge 1800MB){throw 'Compressed corpus is too large for safe NSIS packaging'}
          Remove-Item torah-library.sqlite,corpus-manifest.json -Force
          Pop-Location
      - name: Normalize script encoding for Windows PowerShell
        shell: pwsh
        run: |
          $p='patch-1.7.2/apply-patch.ps1'
          $text=Get-Content $p -Raw -Encoding UTF8
          [System.IO.File]::WriteAllText((Resolve-Path $p),$text,(New-Object System.Text.UTF8Encoding($true)))
      - name: Full patch smoke test on synthetic 1.6.3 installation
        shell: powershell
        run: |
          $fake=Join-Path $env:LOCALAPPDATA 'Programs\hayad-hahazaka'
          Remove-Item $fake -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $fake 'resources') | Out-Null
          Set-Content (Join-Path $fake 'resources\app.asar') 'ORIGINAL-1.6.3-ASAR' -Encoding ASCII
          & .\patch-1.7.2\apply-patch.ps1 -Payload (Resolve-Path '.\patch-1.7.2\payload').Path -Quiet
          if($LASTEXITCODE -ne 0){ throw "Patch smoke test failed with $LASTEXITCODE" }
          if(-not (Test-Path (Join-Path $fake 'resources\app-1.6.3-original.asar'))){throw 'Original app.asar backup missing'}
          if(-not (Test-Path (Join-Path $fake 'resources\local-library\torah-library.sqlite'))){throw 'Local DB missing after patch'}
          $db=Join-Path $fake 'resources\local-library\torah-library.sqlite'
          $sqlite=Join-Path $fake 'resources\local-library\sqlite3.exe'
          $check=& $sqlite -readonly $db 'PRAGMA quick_check;'
          if(($check|Out-String).Trim() -ne 'ok'){throw "SQLite smoke integrity failed: $check"}
          Write-Host "SMOKE OK: original UI bundle preserved; DB bytes=$((Get-Item $db).Length)"
          Remove-Item $fake -Recurse -Force
      - name: Compile UTF-8 NSIS patch EXE
        shell: pwsh
        run: |
          Push-Location patch-1.7.2
          $makensis='C:\Program Files (x86)\NSIS\makensis.exe'
          if(-not (Test-Path $makensis)){throw 'makensis.exe not found'}
          & $makensis /INPUTCHARSET UTF8 installer.nsi
          if($LASTEXITCODE -ne 0){throw 'makensis failed'}
          Pop-Location
          Get-Item patch-1.7.2/HaYad-HaHazaka-Patch-1.7.3.exe | Format-List Name,Length
      - name: Checksum and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='patch-1.7.2/HaYad-HaHazaka-Patch-1.7.3.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  HaYad-HaHazaka-Patch-1.7.3.exe" | Set-Content patch-1.7.2/SHA256-1.7.3.txt
          $notes='1.7.3 fixes the installer shown in the screenshot: proper Hebrew/UTF-8, resilient PowerShell patching, forced shutdown of a running 1.6.3 process, full install log, disk-space check, Expand-Archive extraction, SQLite integrity check, and CI smoke test. The original 1.6.3 app.asar is preserved; the UI is not redesigned.'
          $tag='hayad-v1.7.3-fixed-installer'
          if(gh release view $tag *> $null){gh release upload $tag $exe patch-1.7.2/SHA256-1.7.3.txt --clobber}else{gh release create $tag $exe patch-1.7.2/SHA256-1.7.3.txt --title 'הי״ד החזקה 1.7.3 — תיקון התקנה, ממשק 1.6.3 נשמר' --notes $notes --target $env:GITHUB_SHA}
