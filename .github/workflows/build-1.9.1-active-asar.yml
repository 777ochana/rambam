name: Build HaYad 1.9.1 Active ASAR
on:
  push:
    branches: [v1.9.0-workspace-redesign]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hayad-1.9.1-active-asar
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build191/payload/asar-tool | Out-Null
          Copy-Item build191/apply-1.9.1.js build191/payload/apply-1.9.1.cjs
          $apply = Get-Content build191/payload/apply-1.9.1.cjs -Raw -Encoding UTF8
          $apply = $apply.Replace(",null,2,'utf8')}catch{}process.exit(code)});", ",null,2),'utf8')}catch{}process.exit(code)});")
          [System.IO.File]::WriteAllText((Resolve-Path build191/payload/apply-1.9.1.cjs),$apply,(New-Object System.Text.UTF8Encoding($false)))
          Copy-Item build176/patch-main-1.7.6.js build191/payload/patch-main-1.7.6.cjs
          Copy-Item build181/patch-core-1.8.1.js build191/payload/patch-core-1.8.1.cjs
          Copy-Item build190/patch-visual-1.9.0.js build191/payload/patch-visual-1.9.0.cjs
          Copy-Item build181/core-library-ui.js build191/payload/core-library-ui.js
          Copy-Item build190/workspace-visual-1.9.0.js build191/payload/workspace-visual-1.9.0.js
          Copy-Item (Get-Command node).Source build191/payload/asar-tool/node.exe
          npm install --prefix build191/payload/asar-tool @electron/asar@3.4.1 --omit=dev
          choco install nsis -y --no-progress
      - name: Validate active-ASAR installer and workspace lock
        shell: pwsh
        run: |
          node --check build191/payload/apply-1.9.1.cjs
          node --check build191/payload/patch-main-1.7.6.cjs
          node --check build191/payload/patch-core-1.8.1.cjs
          node --check build191/payload/patch-visual-1.9.0.cjs
          node --check build191/payload/core-library-ui.js
          node --check build191/payload/workspace-visual-1.9.0.js
          $a=Get-Content build191/payload/apply-1.9.1.cjs -Raw -Encoding UTF8
          if(-not $a.Contains("activePackage:'resources/app.asar'")){throw 'Installer does not activate resources/app.asar'}
          if(-not $a.Contains('app-before-1.9.1.asar')){throw 'ASAR backup missing'}
          $v=Get-Content build191/payload/workspace-visual-1.9.0.js -Raw -Encoding UTF8
          if(-not $v.Contains('HOME_BOOKS') -or -not $v.Contains('rb-home-locked-190')){throw 'Home-screen lock missing'}
          if(-not $v.Contains('שאל את המאגר') -or -not $v.Contains('מאגר מקומי')){throw 'Workspace relabels missing'}
          $payload=(Resolve-Path build191/payload).Path
          $node=(Resolve-Path build191/payload/asar-tool/node.exe).Path
          & $node build191/payload/apply-1.9.1.cjs $payload --selftest --quiet
          if($LASTEXITCODE -ne 0){throw "1.9.1 self-test failed: $LASTEXITCODE"}
      - name: Compile Unicode installer
        shell: pwsh
        run: |
          Copy-Item build191/installer-1.9.1.nsi build191/installer.nsi
          Push-Location build191
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /INPUTCHARSET UTF8 installer.nsi
          if($LASTEXITCODE -ne 0){throw 'makensis failed'}
          Pop-Location
      - name: Checksum and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='build191/HaYad-HaHazaka-Update-1.9.1.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  HaYad-HaHazaka-Update-1.9.1.exe" | Set-Content build191/SHA256-1.9.1.txt
          $tag='hayad-v1.9.1-active-asar'
          $notes=@'
          1.9.1 fixes the root cause of the previous no-op installs: Electron searches app.asar before resources/app. This installer rebuilds and verifies the active resources/app.asar from a verified 1.6.3-renderer base, preserving the approved renderer bytes while adding only the local-corpus backend, Core Library hook and external workspace visual layer. The 14-book home screen remains excluded from the redesign. The previous active app.asar is backed up before replacement.
          '@
          gh release view $tag --json tagName *> $null
          if($LASTEXITCODE -eq 0){gh release upload $tag $exe build191/SHA256-1.9.1.txt --clobber} else {gh release create $tag $exe build191/SHA256-1.9.1.txt --title 'הרמב״ם הבהיר 1.9.1 — הפעלת המאגר והעיצוב' --notes $notes --target $env:GITHUB_SHA}
          if($LASTEXITCODE -ne 0){throw 'Release publish failed'}
