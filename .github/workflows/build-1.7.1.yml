name: Build HaYad 1.7.1 Local Chat
on:
  push:
    branches: [v1.7.1-local-chat]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hayad-1.7.1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Reuse verified 1.7.0 local corpus
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prior,resources,resources/ocr | Out-Null
          gh release download hayad-v1.7.0-local -p 'HaYad-HaHazaka-Update-1.7.0.exe' -p 'corpus-manifest.json' -D prior
          Copy-Item prior/corpus-manifest.json resources/corpus-manifest.json
          New-Item -ItemType Directory -Force unpack1,unpack2 | Out-Null
          7z x prior/HaYad-HaHazaka-Update-1.7.0.exe -ounpack1 -y | Out-Null
          $nested=Get-ChildItem unpack1 -Recurse -File | Where-Object {$_.Extension -eq '.7z'} | Select-Object -First 1
          if($nested){ 7z x $nested.FullName -ounpack2 -y | Out-Null }
          $db=Get-ChildItem unpack1,unpack2 -Recurse -Filter 'torah-library.sqlite' -File | Select-Object -First 1
          if(-not $db){ throw 'Could not recover torah-library.sqlite from verified 1.7.0 installer' }
          Copy-Item $db.FullName resources/torah-library.sqlite
          $ocr=Get-ChildItem unpack1,unpack2 -Recurse -Filter 'heb.traineddata' -File | Select-Object -First 1
          if($ocr){ Copy-Item $ocr.FullName resources/ocr/heb.traineddata } else { Invoke-WebRequest -Uri https://github.com/tesseract-ocr/tessdata_fast/raw/main/heb.traineddata -OutFile resources/ocr/heb.traineddata }
          $m=Get-Content resources/corpus-manifest.json -Raw | ConvertFrom-Json
          Write-Host "Reused books=$($m.included.Count) segments=$($m.segments) DB=$([math]::Round((Get-Item resources/torah-library.sqlite).Length/1MB,1))MB"
          if($m.included.Count -lt 100 -or $m.segments -lt 10000){ throw 'Corpus validation failed' }
      - name: Build Windows installer only
        shell: pwsh
        run: |
          npm install
          npx tsc --noEmit
          npm run build:web
          npx electron-builder --win nsis --x64 --publish never
      - name: Test installer on Windows x64
        shell: pwsh
        run: |
          $exe=Get-ChildItem release -Filter '*.exe' | Where-Object {$_.Name -notmatch 'unins'} | Select-Object -First 1
          if(-not $exe){ throw 'Installer missing' }
          $dest='C:\HaYad171Smoke'
          if(Test-Path $dest){ Remove-Item $dest -Recurse -Force }
          $p=Start-Process -FilePath $exe.FullName -ArgumentList '/S',('/D='+$dest) -Wait -PassThru
          if($p.ExitCode -ne 0){ throw "Installer failed with $($p.ExitCode)" }
          $appExe=Get-ChildItem $dest -Recurse -Filter '*.exe' | Where-Object {$_.Name -notmatch 'unins|elevate'} | Select-Object -First 1
          if(-not $appExe){ throw 'Installed application EXE missing' }
          Write-Host "Installed OK: $($appExe.FullName)"
      - name: Checksum
        shell: pwsh
        run: |
          $exe=Get-ChildItem release -Filter '*.exe' | Where-Object {$_.Name -notmatch 'unins'} | Select-Object -First 1
          Get-FileHash $exe.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($exe.Name)" } | Set-Content release/SHA256-1.7.1.txt
          Copy-Item resources/corpus-manifest.json release/corpus-manifest-1.7.1.json
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='hayad-v1.7.1-local-chat'
          $exe=(Get-ChildItem release -Filter '*.exe' | Where-Object {$_.Name -notmatch 'unins'} | Select-Object -First 1).FullName
          $assets=@($exe,(Resolve-Path 'release/SHA256-1.7.1.txt').Path,(Resolve-Path 'release/corpus-manifest-1.7.1.json').Path)
          $notes='גרסה 1.7.1 — שאל את המאגר. LOCAL בלבד: ללא Sefaria וללא HebrewBooks בזמן שימוש. כולל מאגר מקומי, העתקת תשובה ומקורות, יבוא ספרים ידני/OCR, וסיכום AI אופציונלי עם API של המשתמש.'
          if(gh release view $tag *> $null){ gh release upload $tag $assets --clobber } else { gh release create $tag $assets --title 'הי״ד החזקה 1.7.1 — שאל את המאגר' --notes $notes --target $env:GITHUB_SHA }
