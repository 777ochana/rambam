name: Build HaYad 1.8.2 Repair Core Library
on:
  push:
    branches: [v1.8.1-core-upgrade-fix]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hayad-1.8.2-repair
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare repair payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build182/payload/asar-tool | Out-Null
          Copy-Item build182/apply-1.8.2.js build182/payload/apply-1.8.2.cjs
          Copy-Item build176/patch-main-1.7.6.js build182/payload/patch-main-1.7.6.cjs
          Copy-Item build181/patch-core-1.8.1.js build182/payload/patch-core-1.8.1.cjs
          Copy-Item build181/core-library-ui.js build182/payload/core-library-ui.js
          Copy-Item (Get-Command node).Source build182/payload/asar-tool/node.exe
          npm install --prefix build182/payload/asar-tool @electron/asar@3.4.1 --omit=dev
          if(-not (Test-Path 'build182/payload/asar-tool/node_modules/@electron/asar')){throw 'ASAR package missing'}
          choco install nsis -y --no-progress

      - name: Validate repair engine and exact UI fixture
        shell: pwsh
        run: |
          node --check build182/payload/apply-1.8.2.cjs
          node --check build182/payload/patch-main-1.7.6.cjs
          node --check build182/payload/patch-core-1.8.1.cjs
          node --check build182/payload/core-library-ui.js
          New-Item -ItemType Directory -Force build182/fixture | Out-Null
          $fixture=(Get-Content build181/fixture-main-1.6.3.js -Raw -Encoding UTF8).Replace("`r`n","`n")
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'build182/fixture/main.js'),$fixture,(New-Object System.Text.UTF8Encoding($false)))
          Copy-Item build181/fixture-package.json build182/fixture/package.json
          node build182/payload/patch-main-1.7.6.cjs build182/fixture/main.js build182/fixture/package.json
          if($LASTEXITCODE -ne 0){throw 'fixture 1.6.3 -> 1.7.6 failed'}
          node build182/payload/patch-core-1.8.1.cjs build182/fixture/main.js build182/fixture/package.json
          if($LASTEXITCODE -ne 0){throw 'fixture 1.7.6 -> 1.8.1 failed'}
          node --check build182/fixture/main.js
          $m=Get-Content build182/fixture/main.js -Raw -Encoding UTF8
          if(-not $m.Contains('LOCAL_CORE_181')){throw 'LOCAL_CORE_181 missing'}
          if(-not $m.Contains('core-library-ui.js')){throw 'external UI hook missing'}
          $payload=(Resolve-Path build182/payload).Path
          $node=(Resolve-Path build182/payload/asar-tool/node.exe).Path
          $apply=(Resolve-Path build182/payload/apply-1.8.2.cjs).Path
          & $node $apply $payload --selftest --quiet
          if($LASTEXITCODE -ne 0){throw "1.8.2 installer self-test failed: $LASTEXITCODE"}

      - name: Compile Unicode repair installer
        shell: pwsh
        run: |
          Copy-Item build182/installer-1.8.2.nsi build182/installer.nsi
          Push-Location build182
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /INPUTCHARSET UTF8 installer.nsi
          if($LASTEXITCODE -ne 0){throw 'makensis failed'}
          Pop-Location

      - name: Checksum and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe='build182/HaYad-HaHazaka-Repair-1.8.2.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  HaYad-HaHazaka-Repair-1.8.2.exe" | Set-Content build182/SHA256-1.8.2.txt
          $tag='hayad-v1.8.2-repair-core-library'
          $notes=@'
          1.8.2 is a repair installer for machines affected by 1.7.x/1.8.0/1.8.1 intermediate states. It does not replace or repack app.asar. It locates a verified 1.6.3-renderer base, patches only the Electron main backend, and deploys the repaired app as resources/app, which Electron loads ahead of app.asar. app.asar remains untouched as rollback. The Core Library UI stays in resources/core-library/core-library-ui.js. The local SQLite corpus is preserved.
          '@
          gh release view $tag --json tagName *> $null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag $exe build182/SHA256-1.8.2.txt --clobber
          } else {
            gh release create $tag $exe build182/SHA256-1.8.2.txt --title 'הרמב״ם הבהיר 1.8.2 — Repair Core Library' --notes $notes --target $env:GITHUB_SHA
          }
          if($LASTEXITCODE -ne 0){throw 'Release publish failed'}
